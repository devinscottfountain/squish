name: Squish
options:
  bundleIdPrefix: com.devinfountain
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Apple silicon only: no Intel slice, so every build is arm64-native.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Squish:
    type: application
    platform: macOS
    sources: [Squish]
    dependencies:
      - package: Sparkle
    info:
      path: Squish/Info.plist
      properties:
        LSArchitecturePriority: [arm64]
        # Sparkle: updates are listed in appcast.xml on main and signed with the key in Keychain
        # (account "squish"). Losing that key means existing copies can't be updated again.
        SUFeedURL: https://raw.githubusercontent.com/devinscottfountain/squish/main/appcast.xml
        SUPublicEDKey: +jC9dCkP+DQ3dUzMsfpK/EOyFM/ZRRxDTg2agcFaHWk=
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.video, com.compuserve.gif, public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devinfountain.squish
        PRODUCT_NAME: Squish
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Squish
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Devin Fountain"
        # ffmpeg runs as a child process, so the app can't be sandboxed.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [SquishTests]
  SquishTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SquishTests]
    dependencies:
      - target: Squish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.devinfountain.squish.tests
        CODE_SIGN_IDENTITY: "-"
